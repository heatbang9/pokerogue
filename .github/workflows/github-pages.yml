name: "Github Pages"

on:
  push:
    branches:
      - main
      - beta
      - release
      - 'hotfix*'
  pull_request:
    branches:
      - main
      - beta
      - release
      - 'hotfix*'
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gh-pages-path-filter:
    name: GitHub Pages path filter
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      all: ${{ steps.filter.outputs.all }}
    steps:
      # ensure the correct commit is detected on push workflow
      - name: Checkout GitHub repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .nvmrc

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            all:
              - "src/**/*.ts"
              - "test/utils/*.ts"
              - "typedoc.config.js"
              - "tsdoc.json"
              - "tsconfig.json"
              - "typedoc-plugins/**/*"

  pages:
    name: Github Pages
    needs: gh-pages-path-filter
    if: github.repository == 'pagefaultgames/pokerogue' && needs.gh-pages-path-filter.outputs.all == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      docs-dir: ./pokerogue_docs
      # Only push docs when running on pushes to main/beta
      DRY_RUN: ${{ github.event_name != 'push' || (github.ref_name != 'beta' && github.ref_name != 'main') }}

    steps:
      - name: Checkout repository for Typedoc
        uses: actions/checkout@v6
        with:
          path: pokerogue_docs

      - name: Get submodule ref
        id: asset-submodule-ref
        run: |
          cd pokerogue_docs
          SUBMODULE_REF=$(git submodule status assets | awk '{print $1}' | sed 's/^-//')
          echo "asset_ref=$SUBMODULE_REF" >> $GITHUB_OUTPUT
          rm -rf assets

      - name: Checkout asset submodule
        uses: actions/checkout@v6
        with:
          repository: 'pagefaultgames/pokerogue-assets'
          ref: ${{ steps.asset-submodule-ref.asset_ref }}
          path: pokerogue_docs/assets
          sparse-checkout: |
            images/pokemon/variant/_exp_masterlist.json
            images/pokemon/variant/_masterlist.json
            images/logo.png
          sparse-checkout-cone-mode: true
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: "pokerogue_docs/.nvmrc"

      - name: Checkout repository for Github Pages
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          path: pokerogue_gh
          ref: gh-pages

      - name: Install Node.js dependencies
        working-directory: ${{ env.docs-dir }}
        run: pnpm i

      - name: Generate Typedoc docs
        working-directory: ${{ env.docs-dir }}
        env:
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ env.DRY_RUN }}
        run: pnpm typedoc

      - name: Generate root index.html
        if: ${{ env.DRY_RUN == 'false'}}
        run: |
          cat > pokerogue_gh/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PokéRogue Documentation</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
              }
              .container {
                text-align: center;
                padding: 2rem;
              }
              h1 {
                font-size: 3rem;
                margin-bottom: 0.5rem;
                background: linear-gradient(90deg, #ff6b6b, #feca57);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
              }
              p { color: #a0a0a0; margin-bottom: 2rem; font-size: 1.2rem; }
              .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
              a {
                display: inline-block;
                padding: 1rem 2rem;
                background: #ff6b6b;
                color: #fff;
                text-decoration: none;
                border-radius: 8px;
                font-weight: 600;
                transition: transform 0.2s, box-shadow 0.2s;
              }
              a:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
              }
              a.beta { background: #feca57; color: #1a1a2e; }
              a.beta:hover { box-shadow: 0 4px 12px rgba(254, 202, 87, 0.4); }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🎮 PokéRogue</h1>
              <p>Choose a documentation version</p>
              <div class="links">
                <a href="./main/">Stable (Main)</a>
                <a href="./beta/" class="beta">Beta</a>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Commit & Push docs
        # env vars are stored as strings instead of booleans (hence why an explicit check is required)
        if: ${{ env.DRY_RUN == 'false'}}
        run: |
          cd pokerogue_gh
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          rsync -rd --delete /tmp/docs/ $GITHUB_REF_NAME
          git add $GITHUB_REF_NAME index.html
          git commit -m "[skip ci] Deploy docs"
          git push
