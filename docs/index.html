<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéRogue Documentation</title>
    <meta name="description" content="Official documentation for PokéRogue - A Pokémon fangame heavily inspired by the roguelite genre.">
    <meta name="theme-color" content="#da3838">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }
        
        .version-selector {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .version-card {
            flex: 1;
            min-width: 200px;
            padding: 30px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            color: white;
        }
        
        .version-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .version-card.stable {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .version-card.beta {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .version-card h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .version-card p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 14px;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎮</div>
        <h1>PokéRogue</h1>
        <p class="subtitle">Documentation Portal</p>
        
        <div class="version-selector">
            <a href="./main/" class="version-card stable">
                <h2>📦 Stable</h2>
                <p>Main Release</p>
                <span class="badge">Production</span>
            </a>
            
            <a href="./beta/" class="version-card beta">
                <h2>🚧 Beta</h2>
                <p>Development Build</p>
                <span class="badge">Latest Features</span>
            </a>
        </div>
        
        <div class="footer">
            <p>
                <a href="https://github.com/pagefaultgames/pokerogue" target="_blank">GitHub</a> • 
                <a href="https://discord.gg/pokerogue" target="_blank">Discord</a>
            </p>
        </div>
    </div>
</body>
</html>
